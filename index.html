<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="shape your body" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Gym Landing Page</title>
  </head>
  <body>
    <header class="header">
      <div class="container p-lg header__inner">
        <div class="logo">MAX-<strong class="logo__text">GYM</strong></div>
        <div class="toggler">
          <div class="bar bar-one"></div>
          <div class="bar bar-two"></div>
          <div class="bar bar-three"></div>
        </div>
        <nav class="nav">
          <ul class="nav__list">
            <li><a class="nav__link" href="#">Home</a></li>
            <li><a class="nav__link" href="#">Contact</a></li>
            <li><a class="nav__link" href="#">Services</a></li>
            <a href="#" class="btn btn--full header__login_mobile">Login</a>
          </ul>
        </nav>
        <a href="#" class="btn btn--outline header__login">Login</a>
      </div>
    </header>
    <!-- section hero -->
    <section class="hero">
      <div class="container hero__inner">
        <div class="hero__content p-lg">
          <h1 class="hero__title"><strong>SHAPE YOUR BODY</strong></h1>
          <p class="hero__description">
            Lorem Ipsum is simply dummy text of the printing and typesetting
            industry. Lorem Ipsum has been the industry's standard dummy text
            ever since the 1500s
          </p>
          <div class="hero__actions">
            <a href="#" class="btn btn--full">Get Started</a>
            <a href="#" class="btn btn--outline">Get Started</a>
          </div>
        </div>

        <div class="hero__image-box">
          <img
            src="./img/fitness/bodyBuilder1.png"
            alt="Body builder"
            class="hero__img"
          />
        </div>
      </div>
      <div class="hero__bg-right"></div>
    </section>
    <!-- section program first -->

    <script src="/js/main.js"></script>
  </body>
</html>
